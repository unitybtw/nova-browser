<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="tileStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Cardinal Light/Shade -->
    <linearGradient id="cardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="cardShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Diag Light/Shade -->
    <linearGradient id="diagLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="diagShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect x="80" y="80" width="864" height="864" rx="196"
        fill="url(#tileBg)"
        stroke="url(#tileStroke)"
        stroke-width="3" />
  <g filter="url(#starShadow)">
    <polygon points="512.0,512.0 667.6,356.4 536.9,451.9" fill="url(#diagLight)" />
    <polygon points="512.0,512.0 667.6,356.4 572.1,487.1" fill="url(#diagShade)" />
    <polygon points="512.0,512.0 667.6,667.6 572.1,536.9" fill="url(#diagLight)" />
    <polygon points="512.0,512.0 667.6,667.6 536.9,572.1" fill="url(#diagShade)" />
    <polygon points="512.0,512.0 356.4,667.6 487.1,572.1" fill="url(#diagLight)" />
    <polygon points="512.0,512.0 356.4,667.6 451.9,536.9" fill="url(#diagShade)" />
    <polygon points="512.0,512.0 356.4,356.4 451.9,487.1" fill="url(#diagLight)" />
    <polygon points="512.0,512.0 356.4,356.4 487.1,451.9" fill="url(#diagShade)" />
    <polygon points="512.0,512.0 512.0,162.0 481.4,438.1" fill="url(#cardLight)" />
    <polygon points="512.0,512.0 512.0,162.0 542.6,438.1" fill="url(#cardShade)" />
    <polygon points="512.0,512.0 862.0,512.0 585.9,481.4" fill="url(#cardLight)" />
    <polygon points="512.0,512.0 862.0,512.0 585.9,542.6" fill="url(#cardShade)" />
    <polygon points="512.0,512.0 512.0,862.0 542.6,585.9" fill="url(#cardLight)" />
    <polygon points="512.0,512.0 512.0,862.0 481.4,585.9" fill="url(#cardShade)" />
    <polygon points="512.0,512.0 162.0,512.0 438.1,542.6" fill="url(#cardLight)" />
    <polygon points="512.0,512.0 162.0,512.0 438.1,481.4" fill="url(#cardShade)" />
    <!-- Center Ring Outer -->
    <circle cx="512" cy="512" r="68" fill="#0F172A" stroke="url(#cardLight)" stroke-width="4" />
    <!-- Center Ring Inner -->
    <circle cx="512" cy="512" r="44" fill="#020617" />
    <!-- Cyan Center Aperture Core -->
    <circle cx="512" cy="512" r="24" fill="url(#cyanCore)" />
    <!-- Inner White Spark Point -->
    <circle cx="512" cy="512" r="8" fill="#FFFFFF" />
  </g>
</svg>