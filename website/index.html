<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/browser-assets/nova-icon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Browser — A faster, private, open-source browser</title>
    <meta name="description" content="Nova is a productivity-first browser with built-in AI, native ad-blocking, and seamless split-screen workspaces. Fast, beautiful, and completely open source." />
    <meta name="keywords" content="nova browser, open source browser, private browser, ad blocker, electron browser, chromium browser, productivity browser" />
    <meta name="author" content="Nova Browser" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nova-browser.vercel.app/" />
    <meta property="og:title" content="Nova Browser — The internet, reimagined for you" />
    <meta property="og:description" content="A productivity-first browser with built-in AI, native ad-blocking, split-screen workspaces. Fast, beautiful, and completely open source." />
    <meta property="og:image" content="/browser-assets/preview-light.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nova Browser — The internet, reimagined for you" />
    <meta name="twitter:description" content="A productivity-first browser with built-in AI, native ad-blocking, split-screen workspaces." />
    <meta name="twitter:image" content="/browser-assets/preview-light.png" />

    <!-- SEO Enhancements -->
    <link rel="canonical" href="https://nova-browser.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- JSON-LD Structured Data for SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Nova Browser",
      "operatingSystem": "Windows, macOS",
      "applicationCategory": "BrowserApplication",
      "description": "Nova is a productivity-first browser with built-in AI, native ad-blocking, and seamless split-screen workspaces. Fast, beautiful, and completely open source.",
      "url": "https://nova-browser.vercel.app/",
      "image": "https://nova-browser.vercel.app/browser-assets/preview-light.png",
      "author": {
        "@type": "Organization",
        "name": "Nova"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#3b82f6" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
