name: VirusTotal Security Scan & Badging

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to scan (leave empty for latest)'
        required: false
        default: 'latest'

permissions:
  contents: write
  pull-requests: read

jobs:
  virustotal-scan:
    name: VirusTotal Antivirus Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Release Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name || 'latest' }}
        run: |
          mkdir -p release-files
          cd release-files
          if [ "$TAG" = "latest" ]; then
            echo "Downloading latest release assets..."
            gh release download --repo "unitybtw/nova-browser" --pattern "*.exe" --pattern "*.dmg" --pattern "*.AppImage" --pattern "*.deb" || true
          else
            echo "Downloading release $TAG assets..."
            gh release download "$TAG" --repo "unitybtw/nova-browser" --pattern "*.exe" --pattern "*.dmg" --pattern "*.AppImage" --pattern "*.deb" || true
          fi
          ls -la

      - name: Compute SHA-256 Checksums
        run: |
          cd release-files
          if ls * 1> /dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
            echo "### Verified Release Checksums (SHA-256)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat SHA256SUMS.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No binary assets found to hash."
          fi

      - name: Scan Binaries with VirusTotal API
        id: vt
        if: env.VIRUSTOTAL_API_KEY != ''
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          files: |
            release-files/*.exe
            release-files/*.dmg
            release-files/*.AppImage
            release-files/*.deb
          request_rate: 4
          monitor: true

      - name: Publish Step Summary
        run: |
          echo "## VirusTotal Inspection Results" >> $GITHUB_STEP_SUMMARY
          echo "All release binaries submitted to VirusTotal 70+ antivirus engines." >> $GITHUB_STEP_SUMMARY
          if [ -f "release-files/SHA256SUMS.txt" ]; then
            echo "Checksum verification file generated successfully." >> $GITHUB_STEP_SUMMARY
          fi
