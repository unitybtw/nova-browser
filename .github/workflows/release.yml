name: Build & Release Nova Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-mac:
    name: Build macOS (dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Package macOS DMG
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  release-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Package Windows NSIS Installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  publish-release:
    name: Publish Release
    needs: [release-mac, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft Release
        run: |
          node -e '
          async function run() {
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.GITHUB_REF_NAME;
            
            const res = await fetch(`https://api.github.com/repos/${repo}/releases`, {
              headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" }
            });
            const releases = await res.json();
            const draftRelease = Array.isArray(releases) ? releases.find(r => r.tag_name === tag && r.draft) : null;
            if (draftRelease) {
              console.log(`Publishing release ID ${draftRelease.id} for tag ${tag}...`);
              const pub = await fetch(`https://api.github.com/repos/${repo}/releases/${draftRelease.id}`, {
                method: "PATCH",
                headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
                body: JSON.stringify({ draft: false })
              });
              console.log(`Publish status: ${pub.status}`);
            } else {
              console.log("No draft release found for tag:", tag);
            }
          }
          run().catch(console.error);
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
