name: Bug Report
description: Report an issue or unexpected behavior in Nova Browser
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with Nova Browser. Please search existing issues before filing a duplicate. For security vulnerabilities, please refer to our [Security Policy](https://github.com/unitybtw/nova-browser/security/policy).
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running Nova Browser on?
      options:
        - macOS (Apple Silicon / M-series)
        - macOS (Intel)
        - Windows 11 / 10 (x64)
        - Linux (x64)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nova Browser Version
      description: The version of Nova Browser you are using (e.g. 1.5.0)
      placeholder: "1.5.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Launch Nova Browser
        2. Navigate to '...'
        3. Trigger '...'
        4. Observe unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs or Error Output
      description: Relevant logs from DevTools console or terminal output (omit credentials and sensitive tokens).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have verified this is not a duplicate of an existing issue.
          required: true
        - label: I have tested with extensions disabled (if applicable).
          required: false
        - label: This report does not contain credentials, private tokens, or sensitive user data.
          required: true
