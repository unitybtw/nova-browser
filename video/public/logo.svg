<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- Strong visible shadow for squircle so it is clearly visible on white GitHub background -->
    <filter id="squircleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08" />
    </filter>

    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Left Stem: Peach Coral to Radiant Rose -->
    <linearGradient id="leftGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF7253" />
      <stop offset="100%" stop-color="#F43F7E" />
    </linearGradient>

    <!-- Diagonal: Rose Pink to Electric Violet to Royal Indigo -->
    <linearGradient id="diagGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#F43F7E" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Right Stem: Royal Blue to Vibrant Cyan -->
    <linearGradient id="rightGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Soft shadow under the diagonal for ribbon depth -->
    <filter id="ribbonDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="8" stdDeviation="12" flood-color="#7C3AED" flood-opacity="0.30" />
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Visible White Squircle Card with clear outline and depth shadow -->
  <rect x="112" y="112" width="800" height="800" rx="185"
        fill="url(#squircleBg)"
        filter="url(#squircleShadow)"
        stroke="#CBD5E1"
        stroke-width="6" />

  <!-- 3 Geometric Lines: Left Pillar, Right Pillar, Diagonal Ribbon Fold -->
  <g id="novaN">
    <!-- Left Pillar (Vertical rounded capsule) -->
    <rect x="260" y="270" width="130" height="484" rx="65" fill="url(#leftGrad)" />

    <!-- Right Pillar (Vertical rounded capsule) -->
    <rect x="634" y="270" width="130" height="484" rx="65" fill="url(#rightGrad)" />

    <!-- Diagonal Ribbon Bridge (crossing with depth and rounded caps) -->
    <path d="M 325 335 L 699 689"
          stroke="url(#diagGrad)"
          stroke-width="130"
          stroke-linecap="round"
          filter="url(#ribbonDepth)" />
  </g>
</svg>